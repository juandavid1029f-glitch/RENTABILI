<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ROI y ROAS - RENTABILI</title>
    <link rel="stylesheet" href="css/ROI Y ROAS.css">
</head>
<body>

    <header>
        <h1>RENTABILI</h1>

        <nav>
            <a href="index.html">Volver al inicio</a>
        </nav>
    </header>

    <main>

        <section>
            <h2>Calculadora ROI y ROAS</h2>

            <p>
                Analiza los resultados de tus inversiones
                y campañas publicitarias.
            </p>
        </section>

        <section>
            <h3>Calculadora ROI</h3>

            <form>

                <label for="inversion">Inversión realizada:</label>
                <input type="number" id="inversion" name="inversion">

                <br><br>

                <label for="ganancia">Ganancia obtenida:</label>
                <input type="number" id="ganancia" name="ganancia">

                <br><br>

                <button type="button">Calcular ROI</button>

            </form>
        </section>

        <section>
            <h3>Calculadora ROAS</h3>

            <form>

                <label for="publicidad">Dinero invertido en publicidad:</label>
                <input type="number" id="publicidad" name="publicidad">

                <br><br>

                <label for="ingresos">Ingresos generados:</label>
                <input type="number" id="ingresos" name="ingresos">

                <br><br>

                <button type="button">Calcular ROAS</button>

            </form>
        </section>

        <section>
            <h3>Resultados</h3>
            <p>ROI:</p>
            <p>ROAS:</p>
        </section>

    </main>

    <footer>
        <p>RENTABILI © 2026</p>
    </footer>

</body>
</html>
