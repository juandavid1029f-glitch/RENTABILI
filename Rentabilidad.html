<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora de rentabilidad - RENTABILI</title>
    <link rel="stylesheet" href="css/Rentabilidad.css">
</head>
<body>

    <header>
        <h1>RENTABILI</h1>

        <nav>
            <a href="index.html">Volver al inicio</a>
        </nav>
    </header>

    <main>

        <section>
            <h2>Calculadora de rentabilidad</h2>

            <p>
                Conoce cuánto dinero ganas realmente
                después de descontar tus costos y gastos.
            </p>
        </section>

        <section>
            <h3>Ingresa los datos de tu negocio</h3>

            <form>

                <label for="precio">Precio de venta:</label>
                <input type="number" id="precio" name="precio">

                <br><br>

                <label for="costo">Costo del producto:</label>
                <input type="number" id="costo" name="costo">

                <br><br>

                <label for="gastos">Gastos adicionales:</label>
                <input type="number" id="gastos" name="gastos">

                <br><br>

                <button type="button">Calcular rentabilidad</button>

            </form>
        </section>

        <section>
            <h3>Resultados</h3>
            <p>Ganancia:</p>
            <p>Margen de rentabilidad:</p>
        </section>

    </main>

    <footer>
        <p>RENTABILI © 2026</p>
    </footer>

</body>
</html>
